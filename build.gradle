plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        // Headless server that loads all data, runs game tests, then exits (no EULA needed)
        gameTestServer {
            server()
            name = "Game Test Server"
            vmArg "-Dfabric-api.gametest"
            runDir "build/gametest"
        }
    }
}

repositories {
    // Modrinth maven, for the optional Jade compile-only dependency
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Jade is optional: compat/jade only loads when it's installed
    compileOnly "maven.modrinth:jade:${project.jade_version}"
}

processResources {
    def version = project.version
    def minecraftVersion = project.minecraft_version
    def loaderVersion = project.loader_version
    inputs.property "version", version
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "loader_version", loaderVersion
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": version, "minecraft_version": minecraftVersion, "loader_version": loaderVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

jar {
    def archiveBase = project.base.archivesName.get()
    from("LICENSE") {
        rename { "${it}_${archiveBase}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
